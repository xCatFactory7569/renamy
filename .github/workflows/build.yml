name: Build Renamy for macOS 13 (Intel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project Renamy.xcodeproj \
            -scheme Renamy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=13.0 \
            SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad-hoc sign and zip
        run: |
          APP="build/Build/Products/Release/Renamy.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Renamy-macos13.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Renamy-macos13
          path: Renamy-macos13.zip
